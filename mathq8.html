<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoPlay — Level 8</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0e1a;
    --card-bg: rgba(26, 34, 56, 0.85);
    --border: rgba(141, 162, 255, 0.2);
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at top right, #171b38, #070913 90%);
    color: #fff;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .header {
    padding: 18px 28px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    font-size: 18px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .prog {
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    width: 100%;
  }
  .fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #10b981);
    width: 0;
    transition: width 0.3s ease;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 680px;
    width: 90%;
    margin: 30px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(14px);
  }
  .q {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #f8fafc;
    line-height: 1.4;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    margin: 12px 0;
    background: rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn:hover:not(:disabled) {
    background: rgba(99, 102, 241, 0.2);
    border-color: var(--primary-light);
    transform: translateY(-2px);
  }
  .correct {
    background: rgba(16, 185, 129, 0.25) !important;
    border-color: var(--accent) !important;
    color: #a7f3d0 !important;
  }
  .incorrect {
    background: rgba(244, 63, 94, 0.25) !important;
    border-color: var(--danger) !important;
    color: #fecdd3 !important;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    background: rgba(15, 23, 42, 0.85);
    border-top: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
  }
  .next {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    padding: 12px 24px;
    border-radius: 12px;
    border: 0;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
  }
  .next.show { display: inline-block; }
  .back {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
</style>
<link rel="stylesheet" href="multilingual/app-theme.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <span id="qnum">Level 8 — Geometry Mastery</span>
    <span style="font-size: 14px; opacity: 0.8;">📐 Advanced</span>
  </div>
  <div class="prog"><div id="fill" class="fill"></div></div>
  <div class="content">
    <div class="q" id="question">Loading Question...</div>
    <button class="btn" onclick="checkAnswer(this, 'a')" data-choice="a">a</button>
    <button class="btn" onclick="checkAnswer(this, 'b')" data-choice="b">b</button>
    <button class="btn" onclick="checkAnswer(this, 'c')" data-choice="c">c</button>
    <button class="btn" onclick="checkAnswer(this, 'd')" data-choice="d">d</button>
  </div>
  <div class="footer">
    <div>Score: <span id="score">0</span>/<span id="total">4</span></div>
    <div>
      <button class="back" onclick="goBack()">← Back</button>
      <button id="nextBtn" class="next" onclick="goToNextQuestion()">Next →</button>
    </div>
  </div>
</div>

<script>
const quizQuestions = [
  {
    number: 1,
    text: "What is the formula for calculating the area of a circle?",
    answers: { a: "πr²", b: "πr", c: "r²", d: "2πr" },
    correct: "a"
  },
  {
    number: 2,
    text: "What is the value of π (pi) approximately?",
    answers: { a: "2.14", b: "3.14", c: "4.14", d: "5.14" },
    correct: "b"
  },
  {
    number: 3,
    text: "What is the formula for the circumference of a circle?",
    answers: { a: "πr²", b: "2πr", c: "πd²", d: "4πr" },
    correct: "b"
  },
  {
    number: 4,
    text: "What is the area of a circle with radius 5 cm (using π ≈ 3.14)?",
    answers: { a: "78.5 cm²", b: "31.4 cm²", c: "50 cm²", d: "100 cm²" },
    correct: "a"
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

document.getElementById('total').textContent = quizQuestions.length;

function loadQuestion(index) {
  if (index >= quizQuestions.length) {
    showCompletionScreen();
    return;
  }

  const q = quizQuestions[index];
  answered = false;

  document.getElementById('question').textContent = q.text;
  document.getElementById('qnum').textContent = `Level 8 — Question ${q.number} of ${quizQuestions.length}`;

  const btns = document.querySelectorAll('.btn');
  ['a', 'b', 'c', 'd'].forEach((key, i) => {
    btns[i].textContent = `${key}) ${q.answers[key]}`;
    btns[i].dataset.choice = key;
    btns[i].classList.remove('correct', 'incorrect');
    btns[i].disabled = false;
    btns[i].style.opacity = '1';
  });

  document.getElementById('fill').style.width = ((index / quizQuestions.length) * 100) + '%';
  document.getElementById('nextBtn').classList.remove('show');
}

function checkAnswer(button, choice) {
  if (answered) return;
  answered = true;

  const q = quizQuestions[currentQuestion];
  const btns = document.querySelectorAll('.btn');
  btns.forEach(b => b.disabled = true);

  if (choice === q.correct) {
    button.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
  } else {
    button.classList.add('incorrect');
    const correctBtn = Array.from(btns).find(b => b.dataset.choice === q.correct);
    if (correctBtn) correctBtn.classList.add('correct');
  }

  btns.forEach(b => {
    if (!b.classList.contains('correct') && !b.classList.contains('incorrect')) {
      b.style.opacity = 0.6;
    }
  });

  setTimeout(() => {
    document.getElementById('nextBtn').classList.add('show');
  }, 600);
}

function goToNextQuestion() {
  currentQuestion++;
  loadQuestion(currentQuestion);
}

function showCompletionScreen() {
  const total = quizQuestions.length;
  const pct = (score / total) * 100;
  const xp = Math.floor(score * 30 + pct / 2 + 50);

  try {
    const profile = JSON.parse(localStorage.getItem('algoplay_profile')) || { xp: 120, coins: 45, level: 1 };
    profile.xp += xp;
    localStorage.setItem('algoplay_profile', JSON.stringify(profile));
  } catch(e) {}

  alert(`🎉 Level 8 Completed!\n\nFinal Score: ${score}/${total}\nAccuracy: ${pct.toFixed(1)}%\nXP Earned: +${xp} XP`);

  sessionStorage.setItem('level8_score', score);
  sessionStorage.setItem('level8_completed', 'true');
  window.location.href = 'matlevel.html';
}

function goBack() {
  if (confirm("Are you sure you want to exit? Progress will not be saved.")) {
    window.location.href = 'matlevel.html';
  }
}

// Guaranteed Immediate Startup
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => loadQuestion(currentQuestion));
} else {
  loadQuestion(currentQuestion);
}
</script>
<script src="multilingual/site-i18n.js"></script>
<script src="audio-manager.js"></script>
</body>
</html>
