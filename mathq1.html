<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AlgoPlay — Level 1</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark: #0a0e1a;
    --card-bg: rgba(26, 34, 56, 0.85);
    --border: rgba(141, 162, 255, 0.2);
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
  }
  *{box-sizing:border-box;font-family:'Poppins',sans-serif}
  html,body{height:100%;margin:0;background:radial-gradient(circle at top right, #171b38, #070913 90%);color:#fff}
  .wrap{display:flex;flex-direction:column;min-height:100vh}
  .header{padding:18px 28px;background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .prog{height:6px;background:rgba(255,255,255,.08);width:100%}
  .fill{height:100%;background:linear-gradient(90deg, #6366f1, #10b981);width:0;transition:width 0.3s ease}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:680px;width:90%;margin:30px auto;background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:36px 30px;box-shadow:0 20px 50px rgba(0,0,0,0.5);backdrop-filter:blur(14px)}
  .q{font-size:22px;font-weight:700;margin-bottom:24px;color:#f8fafc;line-height:1.4}
  .btn{display:block;width:100%;padding:16px 22px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);margin:12px 0;background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:16px;font-weight:600;text-align:left;cursor:pointer;transition:all 0.25s ease}
  .btn:hover:not(:disabled){background:rgba(99, 102, 241, 0.2);border-color:var(--primary-light);transform:translateY(-2px)}
  .correct{background:rgba(16, 185, 129, 0.25) !important;border-color:var(--accent) !important;color:#a7f3d0 !important}
  .incorrect{background:rgba(244, 63, 94, 0.25) !important;border-color:var(--danger) !important;color:#fecdd3 !important}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:rgba(15, 23, 42, 0.85);border-top:1px solid var(--border);font-size:15px;font-weight:700}
  .next{background:linear-gradient(135deg, var(--primary), var(--primary-light));padding:12px 24px;border-radius:12px;border:0;color:#fff;font-weight:800;cursor:pointer;display:none;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
  .next.show{display:inline-block}
  .back{background:rgba(255,255,255,0.08);border:1px solid var(--border);padding:10px 20px;border-radius:12px;color:#fff;font-weight:700;cursor:pointer}
</style>
<link rel="stylesheet" href="multilingual/app-theme.css">
</head>
<body>
<div class="wrap">
  <div class="header">Level 1 — Arithmetic Basics</div>
  <div class="prog"><div id="fill" class="fill"></div></div>
  <div class="content">
    <div class="q" id="question">Question</div>
    <button class="btn" onclick="answer(this,'a')" data-c="a">a</button>
    <button class="btn" onclick="answer(this,'b')" data-c="b">b</button>
    <button class="btn" onclick="answer(this,'c')" data-c="c">c</button>
    <button class="btn" onclick="answer(this,'d')" data-c="d">d</button>
  </div>
  <div class="footer">
    <div>Score: <span id="score">0</span>/<span id="total">4</span></div>
    <div>
      <button class="back" onclick="goBack()">← Back</button>
      <button id="nextBtn" class="next" onclick="nextQ()">Next →</button>
    </div>
  </div>
</div>

<script>
/* Level 1 questions */
const QUESTIONS = [
  {n:1,text:"What is 3 + 5?", opts:{a:"6", b:"7", c:"8", d:"9"}, correct:"c"},
  {n:2,text:"10 − 4 = ?", opts:{a:"5", b:"6", c:"7", d:"8"}, correct:"b"},
  {n:3,text:"2 × 9 = ?", opts:{a:"16", b:"17", c:"18", d:"19"}, correct:"c"},
  {n:4,text:"15 ÷ 3 = ?", opts:{a:"4", b:"5", c:"6", d:"7"}, correct:"b"}
];

let idx=0, score=0, answered=false;
document.getElementById('total').textContent = QUESTIONS.length;
loadQ();

function loadQ(){
  if(idx>=QUESTIONS.length){ complete(); return; }
  const q = QUESTIONS[idx];
  document.getElementById('question').textContent = q.text;
  const btns = document.querySelectorAll('.btn');
  ['a','b','c','d'].forEach((k,i)=>{
    btns[i].textContent = `${k}) ${q.opts[k]}`;
    btns[i].disabled=false;
    btns[i].classList.remove('correct','incorrect');
    btns[i].style.opacity='1';
    btns[i].dataset.choice = k;
  });
  document.getElementById('fill').style.width = (idx/QUESTIONS.length)*100 + '%';
  document.getElementById('nextBtn').classList.remove('show');
  answered=false;
}

function answer(btn, choice){
  if(answered) return;
  answered=true;
  const q = QUESTIONS[idx];
  const btns = document.querySelectorAll('.btn');
  btns.forEach(b=>b.disabled=true);
  if(choice === q.correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
  } else {
    btn.classList.add('incorrect');
    const cb = Array.from(btns).find(b=>b.dataset.choice === q.correct);
    if(cb) cb.classList.add('correct');
  }
  btns.forEach(b=>{
    if(!b.classList.contains('correct') && !b.classOfstudy && !b.classList.contains('incorrect')){
      b.style.opacity = 0.6;
    }
  });
  btns.forEach(b=>{
    if(!b.classList.contains('correct') && !b.classList.contains('incorrect')){
      b.style.opacity = 0.6;
    }
  });
  setTimeout(()=>document.getElementById('nextBtn').classList.add('show'), 600);
}

function nextQ(){ idx++; loadQ(); }

function complete(){
  const total = QUESTIONS.length;
  const accuracy = (score/total)*100;
  const xp = Math.floor(score*20 + accuracy/3 + 20); // slightly less XP than level 2
  alert(`Level 1 Complete!\nXP: ${xp}\nAccuracy: ${accuracy.toFixed(1)}%`);
  sendLevel(1, xp, accuracy.toFixed(1));
  sessionStorage.setItem('level1_completed','true');
  window.location.href='matlevel.html'; // or Level 2 page
}

async function sendLevel(level,xp,accuracy){
  const sid = sessionStorage.getItem('student_id');
  if(!sid){ console.warn('student_id missing'); return; }
  const payload = {
    student_id: parseInt(sid),
    level,
    xp,
    accuracy: parseFloat(accuracy),
    timestamp:new Date().toISOString()
  };
  try{
    const r = await fetch('/levelupdate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    console.log('levelupdate', await r.json());
  }catch(e){
    console.error('levelupdate error', e);
  }
}

function goBack(){ if(confirm('Exit?')) window.location.href='matlevel.html'; }
</script>
<script src="multilingual/site-i18n.js"></script>
<script src="audio-manager.js"></script>
</body>
</html>
