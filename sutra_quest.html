<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUTRA Quest - Multiplayer Educational Snakes & Ladders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="storageService.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .player-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .player-card.active {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col lg:flex-row overflow-x-hidden">

    <!-- Sidebar Scoreboard (Top on mobile, left on desktop) -->
    <aside class="w-full lg:w-80 bg-slate-900/90 backdrop-blur-md border-b lg:border-b-0 lg:border-r border-slate-800 p-5 flex flex-col justify-between z-20">
        <div>
            <!-- Header Nav -->
            <div class="flex justify-between items-center mb-6">
                <a href="gameboard.html" class="flex items-center gap-1.5 text-xs font-bold text-emerald-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 transition">
                    ← Arcade Hub
                </a>
                <span class="text-xs font-extrabold text-slate-400" id="xpHeader">⭐ 0 XP</span>
            </div>

            <div class="mb-6">
                <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 uppercase tracking-tight">
                    SUTRA QUEST BOARD
                </h1>
                <p class="text-xs text-slate-400 mt-1">Multiplayer Educational Snakes & Ladders</p>
            </div>

            <!-- Player Tokens Scoreboard -->
            <div id="scoreboardList" class="flex flex-col gap-3">
                <!-- Dynamically generated player cards -->
            </div>
        </div>

        <!-- Controls Box -->
        <div class="mt-6 pt-5 border-t border-slate-800">
            <button id="rollDiceBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black rounded-2xl shadow-lg shadow-emerald-900/40 transition-all transform active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed text-base tracking-wide flex items-center justify-center gap-2" disabled>
                <span>🎲</span> Roll Dice
            </button>
            <div class="text-center mt-3">
                <span class="text-xs font-semibold text-slate-400" id="turnStatusText">Waiting to start...</span>
            </div>
        </div>
    </aside>

    <!-- Main Game Board Container -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black overflow-hidden">
        <div class="relative w-full max-w-xl aspect-square bg-slate-900 rounded-3xl shadow-2xl border-4 border-slate-800 overflow-hidden shadow-emerald-950/40" id="canvasWrapper">
            <canvas id="boardCanvas" class="absolute inset-0 w-full h-full block"></canvas>
        </div>
    </main>

    <!-- Mandatory Curriculum Question Modal -->
    <div id="questionModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="bg-slate-900 border-2 border-slate-700 p-6 sm:p-8 rounded-3xl shadow-2xl max-w-lg w-full transform scale-90 transition-all" id="qModalBox">
            
            <div class="flex justify-between items-center mb-5 pb-4 border-b border-slate-800">
                <div>
                    <span class="text-xs font-extrabold uppercase tracking-widest text-slate-400">CURRICULUM GATEWAY</span>
                    <h2 class="text-lg font-black" id="activePlayerName">Player 1's Turn</h2>
                </div>
                <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-800 border border-emerald-500/40 text-emerald-400 font-black text-xl shadow-lg" id="countdownTimer">
                    30
                </div>
            </div>

            <p class="text-base sm:text-lg text-white font-semibold mb-6 leading-relaxed" id="modalQText">
                Loading question...
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="optionsGrid">
                <!-- Answer buttons dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Dice Roll Animation Overlay -->
    <div id="diceOverlay" class="fixed inset-0 z-40 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900/90 border-2 border-emerald-500/50 p-8 rounded-3xl text-center shadow-2xl">
            <div class="text-7xl font-black text-white text-glow mb-2 animate-bounce" id="diceValue">6</div>
            <div class="text-xs font-extrabold text-emerald-400 uppercase tracking-widest">DICE ROLL RESULT</div>
        </div>
    </div>

    <!-- Victory Overlay -->
    <div id="victoryOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-lg opacity-0 pointer-events-none transition-all duration-500 p-4">
        <div class="bg-slate-900 border-2 border-emerald-500 p-8 rounded-3xl text-center max-w-md w-full shadow-2xl">
            <div class="text-6xl mb-3">🏆</div>
            <h2 class="text-3xl font-black text-white text-glow mb-1" id="winnerName">PLAYER WINS!</h2>
            <p class="text-slate-400 text-sm mb-6">Mastered the board and curriculum questions!</p>
            <button id="playAgainBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black rounded-2xl shadow-lg shadow-emerald-900/50 transition">
                Play New Match 🔄
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const rollDiceBtn = document.getElementById('rollDiceBtn');
        const turnStatusText = document.getElementById('turnStatusText');
        const scoreboardList = document.getElementById('scoreboardList');
        const questionModal = document.getElementById('questionModal');
        const qModalBox = document.getElementById('qModalBox');
        const activePlayerName = document.getElementById('activePlayerName');
        const countdownTimer = document.getElementById('countdownTimer');
        const modalQText = document.getElementById('modalQText');
        const optionsGrid = document.getElementById('optionsGrid');
        const diceOverlay = document.getElementById('diceOverlay');
        const diceValue = document.getElementById('diceValue');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const winnerName = document.getElementById('winnerName');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const xpHeader = document.getElementById('xpHeader');

        const players = [
            { id: 1, name: "Player 1 (Red)", color: "#ef4444", pos: 1 },
            { id: 2, name: "Player 2 (Blue)", color: "#3b82f6", pos: 1 },
            { id: 3, name: "Player 3 (Gold)", color: "#f59e0b", pos: 1 },
            { id: 4, name: "Player 4 (Purple)", color: "#a855f7", pos: 1 }
        ];

        let currentPlayerIdx = 0;
        let gridSize = 10;
        let tileSize = 0;
        let timer = null;
        let timeLeft = 30;

        const snakes = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
        const ladders = { 2: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 99 };

        const questionsDB = [
            { q: "What is the equivalent simplified fraction of 8/12?", options: ["2/3", "3/4", "1/2", "4/5"], correct: 0 },
            { q: "Which element has the atomic number 1 on the periodic table?", options: ["Helium", "Hydrogen", "Carbon", "Oxygen"], correct: 1 },
            { q: "What force resists motion between two sliding surfaces?", options: ["Gravity", "Friction", "Inertia", "Magnetism"], correct: 1 },
            { q: "Solve: 15 × 6 - 20 = ?", options: ["70", "80", "60", "90"], correct: 0 },
            { q: "Which organ filters metabolic waste from blood in humans?", options: ["Heart", "Lungs", "Kidneys", "Liver"], correct: 2 },
            { q: "What is the square root of 144?", options: ["10", "11", "12", "14"], correct: 2 }
        ];

        function updateXP() {
            if (window.StorageService) {
                const profile = StorageService.getProfile();
                xpHeader.textContent = `⭐ ${profile.xp || 0} XP`;
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('canvasWrapper');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            tileSize = canvas.width / gridSize;
            drawBoard();
        }
        window.addEventListener('resize', resizeCanvas);

        function getTileCoords(tileNum) {
            const index = tileNum - 1;
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const actualCol = (row % 2 === 0) ? col : (gridSize - 1 - col);
            const actualRow = gridSize - 1 - row;
            return {
                x: actualCol * tileSize,
                y: actualRow * tileSize
            };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Board Tiles
            for (let i = 1; i <= 100; i++) {
                const coords = getTileCoords(i);
                ctx.fillStyle = (i % 2 === 0) ? '#1e293b' : '#0f172a';
                ctx.fillRect(coords.x, coords.y, tileSize, tileSize);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.strokeRect(coords.x, coords.y, tileSize, tileSize);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.font = `bold ${Math.max(10, tileSize * 0.25)}px sans-serif`;
                ctx.fillText(i, coords.x + 4, coords.y + tileSize * 0.3);
            }

            // Draw Ladders (Green Lines)
            for (const [start, end] of Object.entries(ladders)) {
                const s = getTileCoords(parseInt(start));
                const e = getTileCoords(end);
                ctx.save();
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(s.x + tileSize / 2, s.y + tileSize / 2);
                ctx.lineTo(e.x + tileSize / 2, e.y + tileSize / 2);
                ctx.stroke();
                ctx.restore();
            }

            // Draw Snakes (Red Lines)
            for (const [start, end] of Object.entries(snakes)) {
                const s = getTileCoords(parseInt(start));
                const e = getTileCoords(end);
                ctx.save();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(s.x + tileSize / 2, s.y + tileSize / 2);
                ctx.lineTo(e.x + tileSize / 2, e.y + tileSize / 2);
                ctx.stroke();
                ctx.restore();
            }

            // Draw Player Tokens
            players.forEach((p, idx) => {
                const coords = getTileCoords(p.pos);
                const offsetX = (idx % 2) * (tileSize * 0.28) - (tileSize * 0.14);
                const offsetY = Math.floor(idx / 2) * (tileSize * 0.28) - (tileSize * 0.14);

                ctx.save();
                ctx.beginPath();
                ctx.arc(coords.x + tileSize / 2 + offsetX, coords.y + tileSize / 2 + offsetY, tileSize * 0.16, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                ctx.restore();
            });
        }

        function updateScoreboard() {
            scoreboardList.innerHTML = '';
            players.forEach((p, idx) => {
                const isActive = idx === currentPlayerIdx;
                scoreboardList.innerHTML += `
                    <div class="player-card border rounded-2xl p-3 flex items-center justify-between ${isActive ? 'active border-emerald-500 bg-emerald-500/10' : 'border-slate-800 bg-slate-900/60'}">
                        <div class="flex items-center gap-3">
                            <div class="w-4 h-4 rounded-full border-2 border-white shadow" style="background-color: ${p.color}"></div>
                            <div>
                                <div class="font-bold text-xs ${isActive ? 'text-emerald-400' : 'text-slate-300'}">${p.name}</div>
                                <div class="text-[10px] text-slate-400 font-semibold">Position: Tile ${p.pos}</div>
                            </div>
                        </div>
                        ${isActive ? '<span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded-full">ACTIVE</span>' : ''}
                    </div>
                `;
            });
            turnStatusText.textContent = `${players[currentPlayerIdx].name}'s turn to answer!`;
        }

        function startTurn() {
            const p = players[currentPlayerIdx];
            activePlayerName.textContent = `${p.name}'s Quiz Gate`;
            activePlayerName.style.color = p.color;

            const qData = questionsDB[Math.floor(Math.random() * questionsDB.length)];
            modalQText.textContent = qData.q;
            optionsGrid.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-sm text-left text-white transition active:scale-95';
                btn.textContent = opt;
                btn.onclick = () => handleQuestionAnswer(idx === qData.correct);
                optionsGrid.appendChild(btn);
            });

            timeLeft = 30;
            countdownTimer.textContent = timeLeft;

            questionModal.classList.remove('opacity-0', 'pointer-events-none');
            qModalBox.classList.remove('scale-90');
            qModalBox.classList.add('scale-100');

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                countdownTimer.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    closeQuestionModal();
                    turnStatusText.textContent = "⏱️ Time's up! Turn missed.";
                    setTimeout(nextTurn, 1500);
                }
            }, 1000);
        }

        function handleQuestionAnswer(isCorrect) {
            clearInterval(timer);
            closeQuestionModal();

            if (isCorrect) {
                turnStatusText.textContent = "✅ Correct answer! Click ROLL DICE.";
                rollDiceBtn.disabled = false;
            } else {
                turnStatusText.textContent = "❌ Incorrect answer! Turn passed.";
                setTimeout(nextTurn, 1500);
            }
        }

        function closeQuestionModal() {
            questionModal.classList.add('opacity-0', 'pointer-events-none');
            qModalBox.classList.add('scale-90');
        }

        rollDiceBtn.addEventListener('click', () => {
            rollDiceBtn.disabled = true;
            const roll = Math.floor(Math.random() * 6) + 1;
            diceValue.textContent = roll;

            diceOverlay.classList.remove('opacity-0');
            setTimeout(() => {
                diceOverlay.classList.add('opacity-0');
                movePlayer(roll);
            }, 800);
        });

        function movePlayer(roll) {
            const p = players[currentPlayerIdx];
            let targetPos = p.pos + roll;

            if (targetPos > 100) targetPos = 100 - (targetPos - 100);

            p.pos = targetPos;

            // Check Snake or Ladder
            if (ladders[p.pos]) {
                p.pos = ladders[p.pos];
            } else if (snakes[p.pos]) {
                p.pos = snakes[p.pos];
            }

            drawBoard();
            updateScoreboard();

            if (p.pos === 100) {
                winnerName.textContent = `${p.name} WINS!`;
                if (window.StorageService) {
                    StorageService.addReward(150, 50);
                    updateXP();
                }
                victoryOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                setTimeout(nextTurn, 1200);
            }
        }

        function nextTurn() {
            currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
            updateScoreboard();
            startTurn();
        }

        playAgainBtn.addEventListener('click', () => {
            players.forEach(p => p.pos = 1);
            currentPlayerIdx = 0;
            victoryOverlay.classList.add('opacity-0', 'pointer-events-none');
            drawBoard();
            updateScoreboard();
            startTurn();
        });

        // Initialize
        setTimeout(() => {
            resizeCanvas();
            updateXP();
            updateScoreboard();
            startTurn();
        }, 150);
    </script>
</body>
</html>
