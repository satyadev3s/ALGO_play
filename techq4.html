<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AlgoPlay — Tech Level 4</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #080c18;
    --card-bg: rgba(18, 24, 48, 0.88);
    --border: rgba(129, 140, 248, 0.25);
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #38bdf8;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at top right, #191e45, #080b18 90%);
    color: #fff;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .header {
    padding: 18px 28px;
    background: rgba(15, 20, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    font-size: 18px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .timer-badge {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid var(--accent);
    color: #bae6fd;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #38bdf8);
    transition: width 0.35s ease;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 680px;
    width: 90%;
    margin: 30px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
  }
  .question-text {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #f8fafc;
    line-height: 1.4;
  }
  .answer-button {
    display: block;
    width: 100%;
    padding: 16px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    margin: 12px 0;
    background: rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .answer-button:hover:not(:disabled) {
    background: rgba(99, 102, 241, 0.2);
    border-color: var(--primary-light);
    transform: translateY(-2px);
  }
  .correct {
    background: rgba(16, 185, 129, 0.3) !important;
    border-color: #10b981 !important;
    color: #a7f3d0 !important;
  }
  .incorrect {
    background: rgba(244, 63, 94, 0.3) !important;
    border-color: var(--danger) !important;
    color: #fecdd3 !important;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    background: rgba(15, 20, 42, 0.85);
    border-top: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
  }
  .next-button {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    padding: 12px 24px;
    border-radius: 12px;
    border: 0;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
  }
  .next-button.show { display: inline-block; }
  .back-button {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .back-button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
<link rel="stylesheet" href="multilingual/app-theme.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <div id="question-number">🌐 Level 4 — Question 1</div>
    <div class="timer-badge">⏳ <span id="timer">30</span>s</div>
  </div>

  <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:25%"></div></div>

  <div class="content">
    <div id="question-text" class="question-text">Loading question...</div>
    <button class="answer-button" data-answer="a" onclick="selectAnswer(this,'a')"></button>
    <button class="answer-button" data-answer="b" onclick="selectAnswer(this,'b')"></button>
    <button class="answer-button" data-answer="c" onclick="selectAnswer(this,'c')"></button>
    <button class="answer-button" data-answer="d" onclick="selectAnswer(this,'d')"></button>
  </div>

  <div class="footer">
    <div>Score: <strong id="current-score">0</strong>/<span id="total-questions">4</span></div>
    <div style="display:flex;gap:12px;align-items:center">
      <button id="back-button" class="back-button" onclick="goBack()" disabled>← Back</button>
      <button id="next-button" class="next-button" onclick="goNext()">Next →</button>
    </div>
  </div>
</div>

<script>
const TIME_PER_Q = 30;
const LEVEL = 4;
const questions = [
  { number:1, text:"What does LAN stand for in computer networking?", answers:[{l:'a',t:'Large Area Network'},{l:'b',t:'Local Area Network'},{l:'c',t:'Light Area Network'},{l:'d',t:'Linked App Network'}], correct:'b', user:null, remaining:TIME_PER_Q },
  { number:2, text:"Which protocol is used to resolve a domain name into an IP address?", answers:[{l:'a',t:'FTP'},{l:'b',t:'DNS'},{l:'c',t:'SMTP'},{l:'d',t:'DHCP'}], correct:'b', user:null, remaining:TIME_PER_Q },
  { number:3, text:"In computer networking, what does IP stand for?", answers:[{l:'a',t:'Inter Process'},{l:'b',t:'Internet Protocol'},{l:'c',t:'Internal Platform'},{l:'d',t:'Integrated Packet'}], correct:'b', user:null, remaining:TIME_PER_Q },
  { number:4, text:"In the OSI model, packet routing occurs at which layer?", answers:[{l:'a',t:'Physical Layer'},{l:'b',t:'Data Link Layer'},{l:'c',t:'Network Layer'},{l:'d',t:'Transport Layer'}], correct:'c', user:null, remaining:TIME_PER_Q }
];

let state = { idx: 0, timerInterval: null };

const DOM = {
  qText: document.getElementById('question-text'),
  buttons: document.querySelectorAll('.answer-button'),
  nextBtn: document.getElementById('next-button'),
  backBtn: document.getElementById('back-button'),
  score: document.getElementById('current-score'),
  total: document.getElementById('total-questions'),
  qNum: document.getElementById('question-number'),
  progress: document.getElementById('progress-fill'),
  timer: document.getElementById('timer')
};

function render() {
  const q = questions[state.idx];
  DOM.qNum.textContent = `🌐 Level 4 — Question ${q.number} of ${questions.length}`;
  DOM.qText.textContent = q.text;
  DOM.total.textContent = questions.length;
  DOM.score.textContent = questions.filter(x => x.user === x.correct).length;
  DOM.progress.style.width = (((state.idx + 1) / questions.length) * 100) + '%';

  DOM.buttons.forEach((btn, i) => {
    const a = q.answers[i];
    btn.textContent = `${a.l}) ${a.t}`;
    btn.dataset.answer = a.l;
    btn.classList.remove('correct', 'incorrect');
    btn.disabled = q.user !== null;
    btn.style.opacity = '1';
    if (q.user !== null) {
      if (a.l === q.correct) btn.classList.add('correct');
      else if (a.l === q.user) btn.classList.add('incorrect');
      else btn.style.opacity = '0.5';
    }
  });

  DOM.nextBtn.classList[q.user !== null ? 'add' : 'remove']('show');
  DOM.backBtn.disabled = state.idx === 0;
  DOM.timer.textContent = q.remaining;
  startTimer();
}

function startTimer() {
  stopTimer();
  const q = questions[state.idx];
  DOM.timer.textContent = q.remaining;
  if (q.user !== null) return;

  state.timerInterval = setInterval(() => {
    q.remaining--;
    DOM.timer.textContent = q.remaining;
    if (q.remaining <= 0) {
      stopTimer();
      onTimeUp();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function onTimeUp() {
  const q = questions[state.idx];
  if (q.user === null) q.user = 'timeout';
  DOM.buttons.forEach(b => b.disabled = true);
  const correctBtn = [...DOM.buttons].find(b => b.dataset.answer === q.correct);
  if (correctBtn) correctBtn.classList.add('correct');
  setTimeout(() => advanceOrFinish(), 700);
}

function selectAnswer(btn, choice) {
  const q = questions[state.idx];
  if (q.user !== null) return;
  stopTimer();
  q.user = choice;

  DOM.buttons.forEach(b => b.disabled = true);
  if (choice === q.correct) btn.classList.add('correct');
  else {
    btn.classList.add('incorrect');
    const correctBtn = [...DOM.buttons].find(b => b.dataset.answer === q.correct);
    if (correctBtn) correctBtn.classList.add('correct');
  }

  DOM.score.textContent = questions.filter(x => x.user === x.correct).length;
  setTimeout(() => DOM.nextBtn.classList.add('show'), 400);
}

function goNext() { stopTimer(); advanceOrFinish(); }
function goBack() { stopTimer(); if (state.idx === 0) return; state.idx--; render(); }
function advanceOrFinish() { if (state.idx < questions.length - 1) { state.idx++; render(); } else finish(); }

function finish() {
  stopTimer();
  const s = questions.filter(x => x.user === x.correct).length;
  const t = questions.length;
  const pct = (s / t) * 100;
  const msg = pct >= 75 ? '🎉 Excellent!' : pct >= 50 ? '👍 Good!' : '📚 Keep Learning!';

  try {
    const profile = JSON.parse(localStorage.getItem('algoplay_profile')) || { xp: 120, coins: 45, level: 1 };
    profile.xp += (s * 25 + 30);
    localStorage.setItem('algoplay_profile', JSON.stringify(profile));
  } catch(e) {}

  alert(`${msg}\n\nLevel ${LEVEL} Completed!\nFinal Score: ${s}/${t}\n${pct.toFixed(1)}%`);
  sessionStorage.setItem(`level${LEVEL}_completed`, 'true');
  sessionStorage.setItem("completedLevel", LEVEL);
  location.href = 'techlevel.html';
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', render);
} else {
  render();
}
</script>
<script src="multilingual/site-i18n.js"></script>
<script src="audio-manager.js"></script>
</body>
</html>
